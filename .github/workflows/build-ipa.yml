name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          python3 --version

      - name: Check localization keys
        run: python3 Tools/check_localization.py

      - name: Generate Xcode project
        run: python3 Tools/generate_xcode_project.py

      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Zammad.xcodeproj \
            -scheme Zammad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          APP_PATH=$(find DerivedData/Build/Products -type d -name "Zammad.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Zammad.app not found in build products" >&2
            find DerivedData/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          cd package
          zip -qry ../Zammad.ipa Payload
          cd ..
          ls -lh Zammad.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zammad-ipa
          path: Zammad.ipa
          if-no-files-found: error
          retention-days: 30
